# ──────────────────────────────────────────────
#   Alacritty – matches Foot styling
#   Static options live here; matugen writes colors.toml on every
#   wallpaper switch (see matugen/templates/alacritty-colors.toml).
# ──────────────────────────────────────────────

[general]
import = ["~/.config/alacritty/colors.toml"]

[terminal.shell]
program = "zsh"
args = ["-l"]

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12

[window]
# 25px padding, 100x30 chars, 0.92 opacity — same as foot.ini
padding = { x = 25, y = 25 }
dimensions = { columns = 100, lines = 30 }
opacity = 0.92

[scrolling]
history = 10000

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Insert", mods = "Shift", action = "Paste" },
]
