# ──────────────────────────────────────────────
#   Foot Terminal — Arch port of Void's foot.ini
#   Theme-driven colors, regenerated by theme.py on every theme change.
# ──────────────────────────────────────────────

# Matugen-equivalent palette (theme.py pipeline).
# The included file carries its own [colors-dark] section scope.
include=~/.config/foot/colors.ini

[main]
# JetBrainsMono Nerd Font 13pt, zsh login shell
# (login-shell=yes runs `zsh -l`, so ~/.zprofile stays sourced
# and ~/.zshrc prints fastfetch once on every new window).
font=JetBrainsMono Nerd Font:size=13
dpi-aware=yes
shell=zsh
login-shell=yes
# Window padding
pad=8x8 center-when-maximized-and-fullscreen
# Initial window size in pixels (adjust freely)
initial-window-size-pixels=1100x700

[scrollback]
# 10000 scrollback lines
lines=10000

[cursor]
# Beam cursor, 0.5s blink
style=beam
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[key-bindings]
# Ctrl+Insert = copy, Shift+Insert = paste (clipboard).
# Foot maps Shift+Insert to primary-paste by default, so it is freed first.
# These chords are what the SUPER+C/V terminal-aware Hyprland binds inject.
primary-paste=none
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste

[colors-dark]
# Fallback transparency before theme.py writes alpha into colors.ini
alpha=0.92
# Fallback palette — any key present in the included colors.ini overrides
# the value here once the theme pipeline has run at least once.
