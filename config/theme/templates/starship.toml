# Generated by theme.py from ~/.config/theme/templates/starship.toml. Do not edit.
# Colors come from the shared semantic palette (presets or Matugen).
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "theme"

format = """
[╭─](fg:outline)[](fg:primary_container)$os$username[](fg:primary_container bg:secondary_container)$directory[](fg:secondary_container bg:tertiary_container)$git_branch$git_status[](fg:tertiary_container bg:surface_high)$c$rust$golang$nodejs$python$lua[](fg:surface_high)$fill[](fg:surface_high)$cmd_duration[](fg:primary_container bg:surface_high)$time[](fg:primary_container)
[╰─](fg:outline)$character"""

[palettes.theme]
primary = "{{accent}}"
on_primary = "{{cursor_text}}"
primary_container = "{{bg_card}}"
on_primary_container = "{{fg}}"
secondary = "{{fg_dim}}"
secondary_container = "{{bg_track}}"
on_secondary_container = "{{fg}}"
tertiary = "{{highlight}}"
tertiary_container = "{{bg_panel}}"
on_tertiary_container = "{{fg_soft}}"
surface = "{{bg}}"
surface_high = "{{bg_hover}}"
on_surface = "{{fg}}"
on_surface_variant = "{{fg_dim}}"
outline = "{{border_strong}}"
error = "{{danger}}"

[os]
disabled = false
style = "bg:primary_container fg:on_primary_container bold"
[os.symbols]
Arch = " "
Linux = " "

[username]
show_always = false
style_user = "bg:primary_container fg:on_primary_container bold"
style_root = "bg:error fg:on_primary bold"
format = '[$user ]($style)'

[directory]
style = "bg:secondary_container fg:on_secondary_container bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:tertiary_container fg:on_tertiary_container bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:tertiary_container fg:on_tertiary_container"
format = '[$all_status$ahead_behind ]($style)'

[fill]
symbol = "·"
style = "fg:outline"

[cmd_duration]
min_time = 500
style = "bg:surface_high fg:on_surface_variant"
format = "[  $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:primary_container fg:on_primary_container bold"
format = '[  $time ]($style)'

[character]
success_symbol = '[❯](bold fg:primary)'
error_symbol = '[❯](bold fg:error)'
vimcmd_symbol = '[❮](bold fg:tertiary)'
