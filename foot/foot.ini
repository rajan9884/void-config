# ──────────────────────────────────────────────
#   Foot Terminal – Optimized Aesthetic (Void port of kitty.conf)
#   Static options live here; matugen writes colors.ini on every
#   wallpaper switch (see matugen/templates/foot-colors.ini).
# ──────────────────────────────────────────────

[main]
# Matugen palette (regenerated on every wallpaper switch).
# The included file carries its own [colors-dark] section scope.
include=~/.config/foot/colors.ini
# Port of kitty: JetBrainsMono Nerd Font 12pt, zsh shell
font=JetBrainsMono Nerd Font:size=12
shell=zsh
# Port of kitty window_padding_width 25
pad=25x25
# Window decorations: left at foot/sway defaults (sway draws server-side
# borders per sway/config; no CSD override needed for the kitty
# hide_window_decorations parity).
# Initial window size in chars (kitty defaults; adjust freely)
initial-window-size-chars=100x30

# Port of kitty background_opacity 0.92.
# NOTE: foot reads alpha from the [colors] section; it is set in the
# matugen-generated colors.ini (alpha=0.92) so re-themes keep transparency.
# The override below is a fallback for first run before matugen has run.
# (foot has no dynamic_background_opacity equivalent.)

[scrollback]
# Port of kitty scrollback_lines 10000
lines=10000

[cursor]
# Port of kitty: beam cursor, 0.5s blink
style=beam
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[key-bindings]
# Port of kitty.conf: Ctrl+Insert = copy, Shift+Insert = paste (clipboard).
# Foot maps Shift+Insert to primary-paste by default, so it is freed first.
primary-paste=none
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste

[colors-dark]
# Fallback transparency before matugen runs (matugen template also sets this)
alpha=0.92
# Fallback palette — any key present in the included colors.ini overrides
# the value here once matugen has run at least once.
