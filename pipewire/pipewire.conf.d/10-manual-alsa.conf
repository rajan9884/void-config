# Manual ALSA nodes for the Intel SOF card (sof-hda-dsp).
# WirePlumber's ALSA udev monitor is not enumerating the card on this
# machine (pw-dump shows 0 ALSA devices), so expose sink/source statically.
# NOTE: sink and source MUST use different PCM devices — sharing hw:0 for
# both causes contention, crackle and bad quality.
# Sink = analog playback (pcmC0D0p), Source = internal DMIC (pcmC0D6c).
context.spa-libs = {
    api.alsa.* = alsa/libspa-alsa
}

context.objects = [
    { factory = adapter
      args = {
          factory.name = api.alsa.pcm.sink
          node.name = "alsa_output.hw0"
          node.description = "HDA Analog Output"
          media.class = Audio/Sink
          api.alsa.path = "hw:0,0"
          api.alsa.period-size = 2048
          api.alsa.headroom = 8192
          audio.channels = 2
          audio.rate = 48000
          audio.format = "S32LE"
          audio.position = "FL,FR"
          session.suspend-timeout-seconds = 0
          node.pause-on-idle = false
      }
    }
    { factory = adapter
      args = {
          factory.name = api.alsa.pcm.source
          node.name = "alsa_input.dmic"
          node.description = "Internal Mic (DMIC)"
          media.class = Audio/Source
          api.alsa.path = "hw:0,6"
          api.alsa.period-size = 2048
          api.alsa.headroom = 8192
          audio.channels = 2
          audio.rate = 48000
          audio.format = "S32LE"
          audio.position = "FL,FR"
          session.suspend-timeout-seconds = 0
          node.pause-on-idle = false
      }
    }
]
