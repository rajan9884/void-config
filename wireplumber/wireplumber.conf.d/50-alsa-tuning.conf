# WirePlumber tuning for Intel SOF on Acer Swift SFG14-71
# Prevents crackles, buffer underruns, power-suspend audio pops,
# and disables duplicate ALSA hardware mixer attenuation.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*"
      }
      {
        node.name = "~alsa_input.pci.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 2048
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
